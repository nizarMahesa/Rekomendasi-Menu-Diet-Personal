<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilih Bahan - DietPlan</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="index.html">🥗 DietPlan</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="bahan.html">Pilih Bahan</a></li>
        <li class="nav-item"><a class="nav-link" href="rekomendasi.html">Rekomendasi</a></li>
        <li class="nav-item"><a class="nav-link" href="ringkasan.html">Ringkasan</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5 mb-5 fade-in">
  <div class="row justify-content-center">
    <div class="col-md-10">
      <div class="card p-4">
        <div class="d-flex align-items-center justify-content-between gap-3 mb-2 flex-wrap">
          <div>
            <h3 class="mb-0">🧺 Bahan yang Tersedia di Dapurmu</h3>
            <p class="text-muted" id="infoUser"></p>
          </div>
          <div class="text-end">
            <input id="searchBahan" class="form-control form-control-sm" placeholder="Cari bahan..." style="min-width:180px">
            <div class="mt-2 d-flex gap-2 justify-content-end">
              <button id="selectAllBtn" type="button" class="btn btn-sm btn-outline-primary">Pilih Semua</button>
              <button id="clearBtn" type="button" class="btn btn-sm btn-outline-secondary">Bersihkan</button>
            </div>
          </div>
        </div>
        <form id="formBahan">
          <div id="listBahan" class="mt-3"></div>
          <button type="submit" class="btn btn-primary w-100 mt-4">🔍 Cari Rekomendasi Menu</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script src="bahan.js"></script>
</body>
</html>
