<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekomendasi Menu - DietPlan</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="index.html">🥗 DietPlan</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="bahan.html">Pilih Bahan</a></li>
        <li class="nav-item"><a class="nav-link active" href="rekomendasi.html">Rekomendasi</a></li>
        <li class="nav-item"><a class="nav-link" href="ringkasan.html">Ringkasan</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5 mb-5 fade-in">
  <div class="row">
    <div class="col-lg-8">
      <h3>🍽️ Rekomendasi Menu Personal</h3>
      <div id="infoRek" class="mb-2"></div>
      <div id="alergiBadge"></div>
      <div id="rekomendasiNotice"></div>
      <div id="hasilRek" class="mt-3"></div>
    </div>
    <div class="col-lg-4">
      <div class="card p-3 sticky-top" style="top:90px">
        <h6>🔎 Filter</h6>
        <input id="filterSearch" class="form-control form-control-sm mb-2" placeholder="Cari menu...">
        <select id="filterKategori" class="form-select form-select-sm mb-2">
          <option value="">Semua Kategori</option>
          <option value="sarapan">Sarapan</option>
          <option value="makan_siang">Makan Siang</option>
          <option value="makan_malam">Makan Malam</option>
          <option value="snack">Snack</option>
        </select>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="filterVeg">
          <label class="form-check-label small" for="filterVeg">🌱 Vegetarian saja</label>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6"><input id="minKal" type="number" class="form-control form-control-sm" placeholder="Min kkal"></div>
          <div class="col-6"><input id="maxKal" type="number" class="form-control form-control-sm" placeholder="Max kkal"></div>
        </div>
        <select id="sortBy" class="form-select form-select-sm mb-2">
          <option value="skor">Urut: Skor</option>
          <option value="kalori">Urut: Kalori</option>
          <option value="protein">Urut: Protein</option>
        </select>
        <div class="d-grid gap-2">
          <button class="btn btn-sm btn-primary" onclick="applyFilterAction()">Terapkan</button>
          <button class="btn btn-sm btn-outline-secondary" onclick="clearFilterAction()">Reset</button>
        </div>
        <hr>
        <button class="btn btn-sm btn-outline-primary w-100 mb-2" onclick="openPlanModal()">📋 Rencana Makanan</button>
        <button class="btn btn-sm btn-outline-success w-100 mb-2" onclick="randomMenu()">🎲 Menu Random</button>
        <button class="btn btn-sm btn-outline-info w-100 mb-2" onclick="openCompareModal()">⚖️ Bandingkan</button>
        <button class="btn btn-sm btn-outline-warning w-100" onclick="addProteinCommon()">🥩 Tambah Protein</button>
        <hr>
        <h6 class="small">📖 Panduan Bahan</h6>
        <div id="guidePreview" class="small text-muted"></div>
        <button class="btn btn-sm btn-outline-secondary w-100 mt-2" onclick="addAvailableFromGuide()">Tambahkan dari Panduan</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Rencana -->
<div class="modal fade" id="planModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">📋 Rencana Makanan</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="planList"></div>
      <div class="modal-footer">
        <button class="btn btn-sm btn-outline-danger" onclick="clearAllPlan()">Hapus Semua</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="exportPlanJSON()">Export JSON</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="exportPlanCSV()">Export CSV</button>
        <button class="btn btn-sm btn-primary" onclick="printPlan()">🖨️ Cetak</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Bandingkan -->
<div class="modal fade" id="compareModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">⚖️ Bandingkan Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row" id="compareArea"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script src="rekomendasi.js"></script>
</body>
